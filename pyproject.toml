[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "shortflow"
version = "0.1.0"
description = "Daily Korean consumer video creation and human-approved publishing"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pillow>=11,<13", "feedparser>=6,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
shortflow = "shortflow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shortflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
